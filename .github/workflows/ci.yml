name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: lint + pytest + demo smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Ruff lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Pytest (with coverage)
        run: python -m pytest -q -W ignore::UserWarning --cov=ptqforge --cov-report=term-missing

      - name: Demo smoke (determinism + benchmark)
        run: python ptqforge/examples/run_demo.py --seeds 1 2 3 --datasets moons circles gaussian --out benchmark.json
